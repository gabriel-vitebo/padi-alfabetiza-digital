services:
  postgres:
    # Official Bitnami PostgreSQL 18.6.0, image revision 21 (amd64/arm64).
    # Immutable digest: version tags are no longer published in the public catalog.
    image: bitnami/postgresql@sha256:ea7edc281ba9f65e6af5cabbd1ade6e1a32ff473aa79395c2ffd8d6aff8b2036
    ports:
      - "127.0.0.1:${POSTGRESQL_PORT:-5432}:5432"
    environment:
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-padi}
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-padi}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:?Configure POSTGRESQL_PASSWORD no .env}
    volumes:
      - padi_postgres:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRESQL_USERNAME\" -d \"$$POSTGRESQL_DATABASE\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
volumes:
  padi_postgres:
